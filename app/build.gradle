plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thunderx.telegramagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.thunderx.telegramagent"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // ✅ Fix duplicate Kotlin stdlib classes
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    // UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // Core (FileProvider, NotificationCompat, ContextCompat, ActivityCompat)
    implementation 'androidx.core:core:1.12.0'

    // ⛔ Removed: androidx.core:core-ktx — it was pulling in old Kotlin jdk7/jdk8 artifacts
    // We don't need Kotlin extensions since this is a Java-only project.
}